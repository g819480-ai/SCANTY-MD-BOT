services:
  - type: web
    name: scanty-md-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DASHBOARD_ORIGIN
        value: https://scanty-md-dashboard.g819480.workers.dev
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
