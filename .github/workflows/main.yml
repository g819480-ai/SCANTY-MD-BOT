name: SCANTY MD BOT - Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - copilot/repair-activation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Install, Syntax Check and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js

      - name: Check session manager syntax
        run: node --check sessionManager.js

      - name: Check WhatsApp lifecycle syntax
        run: node --check whatsappLifecycle.js

      - name: Check message handler syntax
        run: node --check messageHandler.js

      - name: Check feature settings syntax
        run: node --check featureSettings.js

      - name: Check status events syntax
        run: node --check statusEvents.js

      - name: Run automated tests
        run: npm test
